<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Reality Checker - Summary</title>
    <link href="style.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>

<body>
    <header class="main-header">
        <div class="header-content">
            <div class="left">Small Biz Blueprints</div>
            <div class="right">
                <a href="/summary.html">English</a> | <a href="/es/summary.html">Español</a>
            </div>

            <nav class="center-nav">
                <a href="/index.html">Home</a>
                <a href="/form.html">Plan</a>
                <a href="/resources.html">Resources</a>
                <a href="/about.html">About</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="PDF">
            <h1>Your Business Readiness Summary</h1>
            <div id="answers"></div>
        </div>

        <h2>Recommendations</h2>
        <ul id="recommendations"></ul>

        <div class="nav-buttons" style="margin-top: 2rem;">
            <button class="primary" id="download-pdf">Download as PDF</button>
            <button class="secondary" onclick="restart()">Start Over</button>
        </div>
    </div>

    <script src="summary.js"></script>
    <script src="lib/jspdf.umd.min.js"></script>

    <script>
        (function () {
            function captureAndDownload() {
                const container = document.querySelector(".container");
                if (!container) {
                    alert("Could not find the summary container to export.");
                    return;
                }

                const prevBg = container.style.backgroundColor;
                container.style.backgroundColor = "#ffffff";

                html2canvas(container, { scale: 2, useCORS: true, logging: false, windowWidth: document.documentElement.scrollWidth })
                    .then(canvas => {
                        const imgData = canvas.toDataURL("image/png");
                        const pdf = new window.jspdf.jsPDF("p", "pt", "a4");
                        const pageWidth = pdf.internal.pageSize.getWidth();
                        const pageHeight = pdf.internal.pageSize.getHeight();

                        const imgWidth = pageWidth - 40;
                        const ratio = canvas.height / canvas.width;
                        const imgHeight = imgWidth * ratio;

                        let y = 20;
                        if (imgHeight <= pageHeight - 40) {
                            pdf.addImage(imgData, "PNG", 20, y, imgWidth, imgHeight, undefined, "FAST");
                        } else {
                            let remainingHeight = imgHeight;
                            let position = 20;
                            const pageCanvas = document.createElement("canvas");
                            const pageCtx = pageCanvas.getContext("2d");

                            const pageImgWidthPx = canvas.width * (imgWidth / (pageWidth - 40));
                            const pageImgHeightPx = pageImgWidthPx * (pageHeight - 40) / imgWidth;

                            while (remainingHeight > 0) {
                                pageCanvas.width = canvas.width;
                                pageCanvas.height = Math.min(pageImgHeightPx, canvas.height);
                                pageCtx.fillStyle = "#fff";
                                pageCtx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
                                pageCtx.drawImage(
                                    canvas,
                                    0,
                                    canvas.height - remainingHeight * (canvas.width / imgWidth),
                                    pageCanvas.width,
                                    pageCanvas.height,
                                    0,
                                    0,
                                    pageCanvas.width,
                                    pageCanvas.height
                                );
                                const pageData = pageCanvas.toDataURL("image/png");
                                if (position > 20) pdf.addPage();
                                pdf.addImage(pageData, "PNG", 20, 20, imgWidth, pageHeight - 40, undefined, "FAST");
                                remainingHeight -= (pageHeight - 40);
                                position += pageHeight;
                            }
                        }

                        pdf.save("BusinessRealitySummary.pdf");
                        container.style.backgroundColor = prevBg || "";
                    })
                    .catch(err => {
                        console.error("PDF export failed:", err);
                        alert("PDF export failed. See console for details.");
                    });
            }

            const button = document.getElementById("download-pdf");
            if (button) {
                button.addEventListener("click", captureAndDownload);
            }
        })();
    </script>
</body>

</html>
